[workspace]
authors = [
  "Brian H. Toby <toby@anl.gov>",
  "Robert B. Von Dreele <vondreele@anl.gov>",
  ]
channels = ["conda-forge"]
description = "Structural analysis from neutron and x-ray diffraction"
name = "GSAS-II"
platforms = ["linux-64", "win-64", "osx-arm64", "osx-64"]
preview = ["pixi-build"]

[package]
name = "GSAS-II"
version = "2.0.0"

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[package.build.config]
noarch = false
installer = "pip"
# Linux/macOS: select compilers through conda-forge's compiler infrastructure.
# compiler('c') resolves to gcc (Linux) / clang (macOS) and compiler('fortran')
# to gfortran — the correct platform defaults.  (No C++ sources, so no 'cxx'.)
compilers = ["c", "fortran"]

# Windows: do NOT use the variant-driven compiler() mechanism here.  The
# compiler *variant* is chosen by the consuming workspace, so a downstream
# project that builds GSAS-II via pixi-build would get pixi-build's Windows
# default (MSVC), whose link.exe cannot read the GNU-style (.a) static archives
# that flang's llvm-ar produces (fails with LNK1107).  Instead we pin the LLVM
# toolchain directly as build dependencies (see
# [package.build-dependencies] with the win-64 host_platform guard below);
# their conda activation scripts
# export FC=flang / CC=clang / AR=llvm-ar / LD=lld-link plus the matching
# FFLAGS/LDFLAGS.  This keeps the Windows build self-contained and independent
# of the consumer's compiler variant, so GSAS-II builds with flang/clang no
# matter which workspace drives the pixi-build.
[package.build.target.win-64.config]
noarch = false
compilers = []

[package.host-dependencies]
python = ">=3.10,<3.14"
meson-python = ">=0.17.1,<0.18"
ninja = ">=1.12.1,<2"
cython = ">=3.0.11,<4"
numpy = ">=2.2.1,<2.5.0"
pkg-config = ">=0.29.2,<0.30"
pyproject-metadata = ">=0.9.0,<0.10"
tomli = ">=2.2.1,<3"
wheel = ">=0.45.1,<0.46"
pip = ">=24.3.1,<25"

# Windows LLVM toolchain, pinned as build dependencies so the compiler choice
# travels with the package (see the [package.build.target.win-64.config]
# comment).  These conda-forge activation packages export FC=flang, CC=clang,
# AR=llvm-ar, LD=lld-link and the required FFLAGS/LDFLAGS during the build, so
# GSAS-II builds with the self-contained LLVM toolchain regardless of the
# consuming workspace's compiler variant.
[package.build-dependencies."if(host_platform == 'win-64')"]
flang_win-64 = "*"
clang_win-64 = "*"

[package.run-dependencies]
# required (from pyproject.toml [project.dependencies])
numpy = ">=2.2.1,<2.5.0"
scipy = ">=1.15.0,<2"
pycifrw = ">=4.4.0"
# gui (from pyproject.toml [project.optional-dependencies.gui])
wxpython = ">=4.2.2,<5"
matplotlib-base = ">=3.10.0,<4"
pyopengl = ">=3.1.6,<4"
# useful (from pyproject.toml [project.optional-dependencies.useful])
h5py = ">=3.12.1,<4"
pillow = ">=11.1.0,<12"
requests = ">=2.32.3,<3"
imageio = ">=2.36.1,<3"
zarr = ">=2.18.3,<4"
xmltodict = ">=0.14.2,<0.15"
seekpath = ">=2.1.0,<3"
pybaselines = ">=1.2.0,<2"

# Runtime libraries needed by the compiled Fortran/C extensions.
#
# On Windows the LLVM flang toolchain *statically* links the Fortran runtime
# into each .pyd (verified with dumpbin: the extensions import only
# python3xx.dll, VCRUNTIME140.dll and the UCRT, all already pulled in by
# python), so no extra Fortran-runtime run-dependency is required there.
#
# On Linux/macOS gfortran links libgfortran dynamically, so those runtimes must
# be explicit run-dependencies: pixi-build does not propagate the compilers'
# run-exports, so without them a consumer environment installs GSAS-II without
# the runtime libraries and fails to import the extensions.
[package.run-dependencies."if(host_platform == 'linux-64')"]
libgcc-ng = "*"
libgfortran5 = "*"

[package.run-dependencies."if(host_platform == 'osx-arm64')"]
libgfortran5 = "*"

[package.run-dependencies."if(host_platform == 'osx-64')"]
libgfortran5 = "*"

[dev]
GSAS-II = { path = "." }


[tasks]

clean-build = { cmd = "(rm dist/*whl || true) && (rm -r build || true) " }
build =  { cmd = "python -m build -wnx -vvvv -Cbuild-dir='build'", depends-on = ['clean-build']}

[target.win-64.tasks]
install = { cmd = "pip install dist/*whl --force-reinstall --no-deps", depends-on=['build', 'CIFfix']}

CIFfix =  { cmd = "python -c 'import CifFile'" } # This command fixes a bug in PyCifRW 4.x

# following contains a rather kludgy way to get files into bin area
install-editable =  { cmd = "pip install -ve . --no-build-isolation; /bin/cp -v $(find ./build -name convcell) .pixi/envs/$PIXI_ENVIRONMENT_NAME/bin/; /bin/cp -v $(find ./build -name LATTIC) .pixi/envs/$PIXI_ENVIRONMENT_NAME/bin/", depends-on=['clean-build', 'CIFfix']}
install-editable-win =  { cmd = "pip install -ve . --no-build-isolation; cp ./build/*/sources/LATTIC.exe .pixi/envs/*/Scripts/; cp ./build/*/sources/convcell.exe .pixi/envs/*/Scripts/; ls; ls -d .pixi/envs/*/Scripts/*.exe", depends-on=['clean-build', 'CIFfix']}

build-and-go ={ depends-on= ["install", "ui"]}
#build-and-go-win ={ depends-on= ["install-win", "ui"]}

# Run the test suite from the tests/ directory against the *installed* wheel.
# depends-on 'install' builds + installs the wheel first so the compiled
# Fortran/C extensions (pyspg, pydiffax, ...) are present.  cwd = "tests" makes
# `import GSASII` resolve to the installed package in site-packages instead of
# the un-compiled source tree at the repo root, which would otherwise shadow it
# and fail with "name 'pyspg' is not defined".
test = { cmd = "python -m pytest .", cwd = "tests", depends-on = ['install'] }

ui = 'GSASII_NOPATHHACKING="true" python -m GSASII'

# Pull in the conda-forge compiler *activation* packages for the dev/build
# environment.  These provide flang (Fortran) + clang (C/C++) together with the
# activate.d scripts that export the correct FC/CC/FFLAGS/LDFLAGS (e.g.
# -nostdlib -fms-runtime-lib=dll -fuse-ld=lld and the clang_rt.builtins default
# lib).  Without them `pixi run build` links flang's Fortran objects without the
# runtime flags and fails with "could not open 'flang_rt.runtime.dynamic.lib'".
# This mirrors the toolchain the pixi-build package build gets from the
# `compilers` config, so the workspace wheel build and the conda package build
# use the same self-contained LLVM toolchain.
[target.win-64.dependencies]
flang_win-64 = "*"
clang_win-64 = "*"

[dependencies]
# dev/test only - not declared in any [package.*-dependencies] table
pytest = ">=8.3.4,<9"
gitpython = ">=3.1.44,<4"
ipython = ">=8.32.0,<9"
python-build = ">=1.5.0,<2"
# Force numpy/scipy onto OpenBLAS in the dev env.  Adding the flang/clang
# toolchain (compilers, clang) otherwise lets the solver pull MKL, whose Intel
# OpenMP runtime conflicts with the llvm-openmp shipped by flang and crashes
# numpy.linalg in this environment.  OpenBLAS is conda-forge's default and has
# no such conflict.
libblas = { version = "*", build = "*openblas" }

[feature.py311.dependencies]
python = "<3.12,>=3.11"

[feature.py312.dependencies]
python = "<3.13,>=3.12"

[feature.py313.dependencies]
python = "<3.14,>=3.13"

[feature.py310.dependencies]
python = "<3.11,>=3.10"

[environments]
py310 = ['py310']
py311 = ['py311']
py312 = ['py312']
py313 = ['py313']
